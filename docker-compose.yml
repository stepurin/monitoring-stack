# Logs are shipped by Docker itself to Fluent Bit. fluentd-async keeps
# containers starting even when Fluent Bit is down, so the logging branch
# can be switched off without taking anything else with it.
x-logging: &fluentd
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async: "true"

services:
  worker:
    build: ./app
    container_name: worker
    logging: *fluentd
    ports:
      - "8000:8000"
    environment:
      OTEL_SERVICE_NAME: worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobs

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    logging: *fluentd
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs
    volumes:
      - ./configs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --- logs ---------------------------------------------------------------
  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: fluent-bit
    volumes:
      - ./configs/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    ports:
      - "24224:24224"

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    logging: *fluentd
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"

  # --- traces -------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    logging: *fluentd
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    logging: *fluentd
    volumes:
      - ./configs/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  # --- metrics ------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    logging: *fluentd
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/jobs?sslmode=disable
    ports:
      - "9187:9187"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    logging: *fluentd
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # --- ui -----------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    logging: *fluentd
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro

volumes:
  pgdata:
