[SERVICE]
    flush        1
    log_level    info
    parsers_file parsers.conf

# Docker's fluentd logging driver pushes here, adding container_name to
# every record - which is why logs are identified by name, not by id.
[INPUT]
    name   forward
    listen 0.0.0.0
    port   24224

# The app logs JSON, so unwrap it: trace_id, level and message become
# fields. Plain-text lines from other containers pass through untouched.
[FILTER]
    name         parser
    match        *
    key_name     log
    parser       json
    reserve_data on

# The fluentd driver prefixes the container name with a slash (/my_service),
# and that prefix would end up in the Loki label. Strip it, so queries read
# {container_name="my_service"} the way every doc and dashboard expects.
[FILTER]
    name  lua
    match *
    call  strip_slash
    code  function strip_slash(tag, ts, record) local n = record["container_name"] if n then record["container_name"] = string.gsub(n, "^/", "") end return 2, ts, record end

[OUTPUT]
    name                loki
    match               *
    host                loki
    port                3100
    labels              job=docker
    label_keys          $container_name,$level
    structured_metadata trace_id=$trace_id
    auto_kubernetes_labels off
